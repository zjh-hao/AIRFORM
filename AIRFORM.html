<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="description" content="从此页启动并打开本机的 AIRFORM 手势特效工坊。">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRFORM · Astra Python GPU</title>
<link rel="icon" href="./web/public/airform.svg">
<style>
  :root { color-scheme: dark; font: 16px/1.65 system-ui, sans-serif; background: #101318; color: #eeefe7; }
  body { min-height: 95vh; display: grid; place-items: center; margin: 0; }
  main { width: min(34rem, 86vw); }
  h1 img { width: 1em; margin-right: .45em; }
  a { color: #d8fa43; text-underline-offset: .3em; }
</style>
<main>
  <h1><img src="./web/public/airform.svg" alt="">AIRFORM · Astra Python GPU</h1>
  <p id="status" role="status">正在打开实验工坊…</p>
  <a id="launch" href="airform-astra-python://start" hidden>启动 Python GPU 工坊</a>
  <p id="setup" hidden><a href="./requirement.md">首次安装说明</a></p>
  <noscript><a href="http://127.0.0.1:4197/?input=astra">打开实验工坊</a></noscript>
</main>
<script>
  const origin = 'http://127.0.0.1:4197/';
  const statusLine = document.getElementById('status');
  const launch = document.getElementById('launch');
  let generation = 0;

  function ready() {
    return new Promise(resolve => {
      const marker = new Image();
      const timer = setTimeout(() => resolve(false), 1200);
      marker.onload = marker.onerror = () => {
        clearTimeout(timer);
        resolve(marker.naturalWidth === 7 && marker.naturalHeight === 3);
      };
      marker.src = `${origin}astra-python-ready.svg?t=${Date.now()}`;
    });
  }

  async function connect(starting = false) {
    const current = ++generation;
    const deadline = Date.now() + (starting ? 30000 : 0);
    do {
      const available = await ready();
      if (current !== generation) return;
      if (available) {
        location.replace(`${origin}?input=astra`);
        return;
      }
      if (Date.now() >= deadline) break;
      await new Promise(resolve => setTimeout(resolve, 650));
    } while (current === generation);
    launch.hidden = false;
    document.getElementById('setup').hidden = false;
    statusLine.textContent = starting
      ? '服务还未就绪。请核对首次安装说明，再点「启动 Python GPU 工坊」。'
      : '点「启动 Python GPU 工坊」，如果浏览器询问，请允许打开本机应用。';
  }

  launch.addEventListener('click', () => {
    statusLine.textContent = '正在等待 Python GPU 工坊启动…';
    void connect(true);
  });
  void connect();
</script>
</html>
